name: Daily Promo Posting

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      force_repost:
        description: "Reset posted flags for Kaufland and Linella before run"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  run-daily-posting:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      USE_PLAYWRIGHT: "1"
      MIN_DISCOUNT_PERCENTAGE: "30"
      TELEGRAM_SEND_DELAY_SECONDS: "1.1"
      TELEGRAM_MAX_POSTS_PER_RUN: "20"
      TELEGRAM_ITEMS_PER_GROUP: "4"
      ENABLE_LINELLA: "1"
      DATABASE_PATH: "data/promotions.db"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Ensure data folder and DB file
        run: |
          mkdir -p data
          touch data/promotions.db
          [ -f data/revista_post_state.json ] || echo '{}' > data/revista_post_state.json

      - name: Validate Telegram secrets
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHANNEL_ID" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHANNEL_ID in repository secrets"
            exit 1
          fi

      - name: Optional reset for manual repost
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_repost == true }}
        run: |
          python - <<'PY'
          import sqlite3

          conn = sqlite3.connect("data/promotions.db")
          conn.execute(
              "UPDATE products SET posted_to_telegram = 0 WHERE source_code IN ('kaufland', 'linella')"
          )
          conn.commit()
          conn.close()
          print("Reset posted_to_telegram for kaufland and linella")
          PY

      - name: Run daily posting
        run: |
          python run_daily_posting.py

      - name: Commit state updates for dedup persistence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/promotions.db
          [ -f data/revista_post_state.json ] && git add data/revista_post_state.json || true
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "chore: update posting state [skip ci]"
          git push

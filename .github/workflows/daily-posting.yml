name: Daily Promo Posting

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-daily-posting:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      USE_PLAYWRIGHT: "1"
      MIN_DISCOUNT_PERCENTAGE: "30"
      TELEGRAM_SEND_DELAY_SECONDS: "1.1"
      TELEGRAM_MAX_POSTS_PER_RUN: "20"
      TELEGRAM_ITEMS_PER_GROUP: "4"
      ENABLE_LINELLA: "1"
      DATABASE_PATH: "data/promotions.db"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Ensure data folder and DB file
        run: |
          mkdir -p data
          touch data/promotions.db

      - name: Run daily posting
        run: |
          python run_daily_posting.py

      - name: Commit DB updates for dedup persistence
        run: |
          if git diff --quiet -- data/promotions.db; then
            echo "No DB changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/promotions.db
          git commit -m "chore: update promotions db [skip ci]"
          git push

name: Promo Scraper Auto-Post

on:
  schedule:
    # Run daily at 08:00 UTC (adjust as needed)
    - cron: '0 8 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Restore promotions DB cache
        id: restore-db
        uses: actions/cache/restore@v4
        with:
          path: data/promotions.db
          key: promotions-db-${{ github.repository }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            promotions-db-${{ github.repository }}-${{ github.ref_name }}-
            promotions-db-${{ github.repository }}-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run promo scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          MIN_DISCOUNT_PERCENTAGE: ${{ vars.MIN_DISCOUNT_PERCENTAGE || '30' }}
          TELEGRAM_SEND_DELAY_SECONDS: ${{ vars.TELEGRAM_SEND_DELAY_SECONDS || '1.1' }}
          TELEGRAM_MAX_POSTS_PER_RUN: ${{ vars.TELEGRAM_MAX_POSTS_PER_RUN || '20' }}
          METRO_HEADLESS: '1'
        run: |
          # Run scraper
          python main.py

      - name: Save promotions DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/promotions.db
          key: promotions-db-${{ github.repository }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload database artifact (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promotions-db
          path: data/promotions.db
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "Promo scraper job failed!"
          exit 1
